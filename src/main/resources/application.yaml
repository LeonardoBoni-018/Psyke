spring:
  application:
    name: psyke

  kafka:
    bootstrap-servers: ${PSYKE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "appointment-event:com.br.psyke.psyke.event.AppointmentEvent,session-event:com.br.psyke.psyke.event.SessionEvent"
    consumer:
      group-id: psyke-waiting-list
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: "appointment-event:com.br.psyke.psyke.event.AppointmentEvent,session-event:com.br.psyke.psyke.event.SessionEvent"
        spring.json.trusted.packages: "*"

  datasource:
    url: ${PSYKE_DB_URL:jdbc:postgresql://localhost:5432/psyke_master}
    username: ${PSYKE_DB_USER:postgres}
    password: ${PSYKE_DB_PASS:postgres}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  mail:
    host: ${PSYKE_MAIL_HOST:}
    port: ${PSYKE_MAIL_PORT:587}
    username: ${PSYKE_MAIL_USER:}
    password: ${PSYKE_MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.br.psyke.psyke: DEBUG
    org.springframework.web: INFO
  file:
    name: logs/psyke.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [tenant:%X{tenantId}] %-5level %logger{36} - %msg%n"

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

app:
  base-url: ${PSYKE_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${PSYKE_JWT_SECRET:CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME}
    expiration-ms: ${PSYKE_JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${PSYKE_JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${PSYKE_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    from: ${PSYKE_MAIL_FROM:noreply@psyke.com}
  upload:
    path: ${PSYKE_UPLOAD_PATH:${java.io.tmpdir}/psyke-uploads}

psyke:
  ai:
    enabled: ${PSYKE_AI_ENABLED:false}
    api-key: ${PSYKE_AI_API_KEY:}
    model: ${PSYKE_AI_MODEL:gpt-4o-mini}
    api-url: ${PSYKE_AI_API_URL:https://api.openai.com/v1}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  logging:
    level:
      com.br.psyke.psyke: INFO
